services:
  minio:
    image: minio/minio:latest
    container_name: ecf1-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_ecf:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: ecf1-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: scraping_db
    volumes:
      - mongo_data_ecf:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo-express:
    image: mongo-express:latest
    container_name: ecf1-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  ecf1-postgre:
    image: postgres:latest
    container_name: ecf1-postgre
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: tata
      POSTGRES_DB: scraping_db
    restart: always
    volumes:
      - local_pgdata_ecf:/var/lib/postgresql
      - ./scripts_init:/docker-entrypoint-initdb.d
    ports:
      - "8001:5432"
    networks:
      - db_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    depends_on:
      - ecf1-postgre
    environment:
      PGADMIN_DEFAULT_EMAIL: a@a.fr
      PGADMIN_DEFAULT_PASSWORD: secret
      PMA_HOST: ecf1-postgre
    ports:
      - "8002:80"
    volumes:
      - pgadmin-data_ecf:/var/lib/pgadmin
    networks:
      - db_network

volumes:
  minio_data_ecf:
  mongo_data_ecf:
  local_pgdata_ecf:
  pgadmin-data_ecf:

networks:
  db_network:
